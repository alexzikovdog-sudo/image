name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    # Принудительное принятие всех лицензий (решает проблему с MIPS)
    - name: Accept Additional SDK Licenses
      run: |
        echo y | sdkmanager --licenses
        echo y | sdkmanager --sdk_root=$ANDROID_HOME --licenses

    # ВАЖНО: Судя по вашим скриншотам, файлы проекта лежат в папке ImageGen.
    # Поэтому мы указываем working-directory: ./ImageGen
    - name: Grant execute permission for gradlew
      working-directory: ./ImageGen
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./ImageGen
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # Путь к готовому APK файлу внутри папки ImageGen
        path: ImageGen/app/build/outputs/apk/debug/app-debug.apk
